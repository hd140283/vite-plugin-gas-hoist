name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vite-version: [6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D vite@${{ matrix.vite-version }}
      - run: pnpm lint:ci
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vite-version: [6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build example with Vite ${{ matrix.vite-version }}
        working-directory: example
        run: |
          npm install
          npm install file:.. vite@${{ matrix.vite-version }} --save-dev
          npm run dev
      - name: Verify hoisted output
        working-directory: example
        run: |
          grep -qF "function functionDecl(...args)" dist/app.js
          grep -qF "const constValue = lib_.constValue" dist/app.js
          grep -qF "const constArrow = (...args) => lib_.constArrow" dist/app.js
          grep -qF "const constFunction = function(...args)" dist/app.js
          grep -qF "let letValue = lib_.letValue" dist/app.js
          grep -qF "let letArrow = (...args) => lib_.letArrow" dist/app.js
          grep -qF "let letFunction = function(...args)" dist/app.js
          grep -qF "var varValue = lib_.varValue" dist/app.js
          grep -qF "var varArrow = (...args) => lib_.varArrow" dist/app.js
          grep -qF "var varFunction = function(...args)" dist/app.js
